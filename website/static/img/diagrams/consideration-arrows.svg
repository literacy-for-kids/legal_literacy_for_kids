<svg viewBox="0 0 860 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="coTitle">
  <title id="coTitle">Consideration: a two-arrow diagram showing that each person gives something in a real deal — Maya gives Saturday dog-walking, Eli gives two comic books</title>
  <defs>
    <marker id="coA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="858" height="338" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="430" y="42" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="22" font-weight="700" fill="#1e293b">A Real Deal Has Two Arrows</text>
  <text x="430" y="66" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" fill="#64748b">Each person gives something. That trade is the &#8220;consideration.&#8221;</text>

  <!-- person A -->
  <g>
    <circle cx="150" cy="150" r="26" fill="#b45309"/>
    <path d="M110,215 a40,32 0 0 1 80,0 z" fill="#b45309"/>
    <text x="150" y="255" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e293b">Maya</text>
  </g>

  <!-- person B -->
  <g>
    <circle cx="710" cy="150" r="26" fill="#d97706"/>
    <path d="M670,215 a40,32 0 0 1 80,0 z" fill="#d97706"/>
    <text x="710" y="255" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e293b">Eli</text>
  </g>

  <!-- arrows -->
  <line x1="235" y1="140" x2="620" y2="140" stroke="#b45309" stroke-width="3.5" marker-end="url(#coA)"/>
  <rect x="300" y="102" width="260" height="30" rx="15" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="430" y="122" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="13.5" fill="#1e293b">&#8220;I give: dog-walking on Saturday&#8221;</text>

  <line x1="620" y1="200" x2="235" y2="200" stroke="#b45309" stroke-width="3.5" marker-end="url(#coA)"/>
  <rect x="320" y="208" width="220" height="30" rx="15" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="430" y="228" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="13.5" fill="#1e293b">&#8220;I give: two comic books&#8221;</text>

  <text x="430" y="300" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" fill="#64748b">Only one arrow? Then it is a gift or a favor &#8212; kind, but not a contract.</text>
</svg>
